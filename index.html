    // ---- tools: one colourful panel per step, with a sticky tab bar that follows the scroll
    const createArt = h('div', { class: 'art' },
      h('div', { class: 'mock' },
        h('h4', {}, 'New project'),
        h('div', { class: 'fld' }, h('small', {}, 'Project title'), 'Brand identity refresh'),
        h('div', { class: 'fld' }, h('small', {}, 'Client'), 'Studio Nara'),
        [['Moodboard', 'Oct 5'], ['Logo concepts', 'Oct 19'], ['Final files', 'Nov 2']].map(([title, due], i) =>
          h('div', { class: 'mrow', style: `--i:${i}` }, h('span', {}, title), h('span', {}, due))),
        h('div', { class: 'fake-btn' }, 'Create on BOT Chain')),
      cursor('You', '#7C3AED', 'right:8%;bottom:6%'));

    const demoRow = (title, due) => h('div', { class: 'demo-ms' },
      h('span', { class: 'st' }, h('span', { class: 'o' }, icon('circle', 20)), h('span', { class: 'spin' }), h('span', { class: 'ok' }, icon('checkCircle', 20))),
      h('div', {}, h('div', {}, title), h('div', { class: 'due' }, due)),
      h('span', { class: 'tag' },
        h('span', { class: 't-open' }, 'Mark complete'),
        h('span', { class: 't-busy' }, 'Stamping…'),
        h('span', { class: 'pill done t-done' }, icon('shield', 14), 'Verified')));
    const demo = h('div', { class: 'demo' },
      mascot('perch'),
      h('div', { class: 'demo-top' },
        h('div', {}, h('h4', {}, 'Brand identity refresh'), h('p', { class: 'client' }, 'Studio Nara')),
        h('span', { class: 'pill demo-status' }, icon('sparkle', 14), 'In progress')),
      h('div', { class: 'progress-line' }, h('span', { class: 'demo-count' }, '0 / 3 milestones'), h('div', { class: 'bar' }, h('i'))),
      h('div', { class: 'demo-list' }, demoRow('Moodboard', 'Due Oct 5'), demoRow('Logo concepts', 'Due Oct 19'), demoRow('Final files', 'Due Nov 2')));
    const stampArt = h('div', { class: 'art', 'aria-hidden': 'true' }, demo);

    const shareArt = h('div', { class: 'art', 'aria-hidden': 'true' },
      h('div', { class: 'mock browser' },
        h('div', { class: 'bbar' }, h('i'), h('i'), h('i'), h('div', { class: 'burl' }, h('span', {}, 'your-site.com/?project=12'))),
        h('div', { class: 'bbody' },
          h('div', { class: 'eyebrow' }, icon('shield', 13), 'Progress report'),
          h('h4', {}, 'Brand identity refresh'),
          h('div', { class: 'progress-line' }, h('span', {}, '2 of 3 completed'), (() => { const bar = h('div', { class: 'bar' }, h('i')); bar.firstChild.style.width = '66%'; return bar; })()),
          h('div', { class: 'vrow', style: 'margin-top:14px' }, icon('checkCircle', 20), h('div', {}, 'Moodboard'), verified(0)),
          h('div', { class: 'vrow' }, icon('checkCircle', 20), h('div', {}, 'Logo concepts'), verified(1)))),
      cursor('Client', '#0EA5A4', 'right:4%;top:34%'));

    const verifyArt = h('div', { class: 'art', 'aria-hidden': 'true' },
      h('div', { class: 'mock' },
        [['Moodboard', 'Stamped Oct 2 · 14:02'], ['Logo concepts', 'Stamped Oct 10 · 09:41'], ['Final files', 'Stamped Oct 13 · 17:26']].map(([title, when], i) =>
          h('div', { class: 'vrow' }, icon('checkCircle', 20), h('div', {}, title, h('small', {}, when)), verified(i))),
        h('div', { class: 'mock-foot' }, 'Times come from the block, not from you.')));

    const TOOLS = [
      { key: 'create', label: 'Create', iconName: 'plusSquare', title: 'Turn a brief into a plan that lives on-chain', text: 'Name the project and the client, then add up to ten milestones with due dates. One transaction puts the plan on BOT Chain.', cta: 'Create a project', art: createArt },
      { key: 'stamp', label: 'Stamp', iconName: 'checkCircle', title: 'Stamp each milestone the moment it’s done', text: 'Mark it complete and the contract records the time. Only the wallet that created the project can do it, and only once.', cta: 'Start stamping', art: stampArt },
      { key: 'share', label: 'Share', iconName: 'link', title: 'Share one link. Your client needs no wallet', text: 'Copy the client link and send it. It opens a read-only progress page that loads straight from the contract.', cta: 'Get your link', art: shareArt },
      { key: 'verify', label: 'Verify', iconName: 'shield', title: 'Dates that can’t be backdated', text: 'Every completed milestone carries a verified badge and its block timestamp. Nobody can edit it afterwards, including you.', cta: 'Open the app', art: verifyArt },
    ];
    const panels = TOOLS.map((t) => h('article', { class: `tool reveal ${t.key}`, id: `tool-${t.key}` },
      h('div', {}, h('h3', {}, t.title), h('p', {}, t.text), launch(t.cta)), t.art));
    const tabs = TOOLS.map((t, i) => h('button', { class: 'tb' + (i ? '' : ' active'), type: 'button', onclick: () => panels[i].scrollIntoView({ behavior: 'smooth' }) }, icon(t.iconName, 20), t.label));
    const tools = h('section', { class: 'sec', id: 'tools' },
      h('h2', { class: 'reveal' }, 'Tools to prove your best work'),
      h('div', { class: 'toolbar' }, tabs),
      h('div', { class: 'tools' }, panels));

    // ---- meet Stampy + closing
    const suite = h('section', { class: 'sec' },
      h('h2', { class: 'reveal' }, 'All the proof. All in one place.'),
      h('div', { class: 'suite reveal' },
        h('div', {}, h('h3', {}, 'Meet Stampy'),
          h('p', {}, 'Stampy is the rubber stamp behind every tick. No sign-up, no subscription, and nothing in the contract but your progress. Your wallet is your account.'),
          launch('Launch app')),
        h('div', { class: 'suite-art', 'aria-hidden': 'true' }, mascot('loop'),
          h('span', { class: 'chip c1' }, icon('check', 15), 'No tokens'),
          h('span', { class: 'chip c2' }, icon('check', 15), 'No payments'),
          h('span', { class: 'chip c3' }, icon('check', 15), 'No escrow'))));
    const final = h('section', { class: 'final reveal' }, h('h2', {}, 'Start stamping with Freelance Flow'), launch('Get started', 'btn primary lg'));

    const page = h('div', { class: 'landing-page' }, hero, tools, suite, final);
    startDemo(demo);
    const seen = new IntersectionObserver((entries) => {
      for (const entry of entries) if (entry.isIntersecting) { entry.target.classList.add('in'); seen.unobserve(entry.target); }
    }, { rootMargin: '0px 0px -8% 0px' });
    for (const el of page.querySelectorAll('.reveal')) seen.observe(el);
    // The tab for whichever panel crosses the middle of the screen is the active one.
    const spy = new IntersectionObserver((entries) => {
      for (const entry of entries) if (entry.isIntersecting) tabs.forEach((tab, i) => tab.classList.toggle('active', panels[i] === entry.target));
    }, { rootMargin: '-50% 0px -50% 0px' });
    for (const panel of panels) spy.observe(panel);
    return page;
  }

  // ============================================================
  // New project dialog
  // ============================================================
  const dialog = $('new-dialog');
  let creating = false;

  function milestoneInputRow() {
    const row = h('div', { class: 'ms-row' },
      h('input', { type: 'text', maxlength: String(MAX_TITLE_BYTES), placeholder: 'Milestone title', 'aria-label': 'Milestone title', autocomplete: 'off' }),
      h('input', { type: 'date', 'aria-label': 'Due date' }),
      h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Remove milestone', onclick: () => { row.remove(); syncMilestoneRows(); } }, icon('x', 18)));
    return row;
  }
  function syncMilestoneRows() {
    const rows = [...$('np-rows').children];
    rows.forEach((row) => { row.querySelector('button').disabled = rows.length === 1; });
    $('np-add').hidden = rows.length >= MAX_MILESTONES;
    $('np-count').textContent = `${rows.length} of ${MAX_MILESTONES}`;
  }
  function formError(text) {
    $('np-error').hidden = !text;
    $('np-error').textContent = text || '';
  }
  function resetSubmit() {
    creating = false;
    const submit = $('np-submit');
    submit.disabled = false;
    submit.classList.remove('busy');
    $('np-cancel').disabled = false;
  }

  async function openNewProject() {
    if (!state.account && !(await connect())) return;
    if (dialog.open) return;
    $('new-form').reset();
    $('np-rows').replaceChildren(milestoneInputRow());
    syncMilestoneRows();
    formError('');
    resetSubmit();
    $('np-submit').textContent = 'Create on BOT Chain';
    dialog.showModal();
    $('np-title').focus();
  }

  function readNewProject() {
    const title = $('np-title').value.trim();
    const client = $('np-client').value.trim();
    if (!title) return { error: 'Give the project a title.', focus: $('np-title') };
    if (bytes(title) > MAX_TITLE_BYTES) return { error: 'The project title is too long (80 characters at most, fewer with accents or emoji).', focus: $('np-title') };
    if (!client) return { error: 'Add a client name or initials.', focus: $('np-client') };
    if (bytes(client) > MAX_CLIENT_BYTES) return { error: 'The client name is too long (60 characters at most, fewer with accents or emoji).', focus: $('np-client') };
    const titles = [];
    const dueDates = [];
    for (const [i, row] of [...$('np-rows').children].entries()) {
      const [name, date] = row.querySelectorAll('input');
      const milestone = name.value.trim();
      if (!milestone) return { error: `Give milestone ${i + 1} a title, or remove it.`, focus: name };
      if (bytes(milestone) > MAX_TITLE_BYTES) return { error: `Milestone ${i + 1}'s title is too long (80 characters at most).`, focus: name };
      const due = Date.parse(date.value + 'T00:00:00Z') / 1000;
      if (!date.value || !Number.isFinite(due) || due <= 0) return { error: `Pick a due date for milestone ${i + 1}.`, focus: date };
      titles.push(milestone);
      dueDates.push(due);
    }
    return { title, client, titles, dueDates };
  }

  async function submitNewProject(e) {
    e.preventDefault();
    if (creating) return;
    const input = readNewProject();
    if (input.error) { formError(input.error); input.focus.focus(); return; }
    formError('');
    creating = true;
    setBusy($('np-submit'), 'Stamping on BOT Chain…');
    $('np-cancel').disabled = true;
    try {
      await ensureChain();
      const { id, hash, createdAt } = await store.create(input.title, input.client, input.titles, input.dueDates);
      const project = {
        id, owner: state.account, title: input.title, client: input.client, createdAt, total: input.titles.length, done: 0,
        milestones: input.titles.map((t, i) => ({ title: t, dueDate: input.dueDates[i], completedAt: 0 })),
      };
      (state.projects ||= []).push(project);
      state.tab = 'active';
      resetSubmit();
      dialog.close();
      toast('Project created', `“${input.title}” is on ${PREVIEW ? 'your board' : NET.name}. Mark milestones complete as you finish them.`, txUrl(hash) && { label: 'View transaction', href: txUrl(hash) });
      if (location.hash === `#/project/${id}`) route(); else location.hash = `#/project/${id}`;
    } catch (err) {
      resetSubmit();
      $('np-submit').textContent = 'Try again';
      formError(errorText(err));
    }
  }

  // ============================================================
  // Routing and chrome
  // ============================================================
  function currentRoute() {
    if (PROOF_MODE) return { name: 'proofPage', id: /^\d+$/.test(proofParam) ? Number(proofParam) : NaN };
    if (location.hash.length < 2) return { name: 'landing' };
    const hash = location.hash.replace(/^#\/?/, '');
    const project = hash.match(/^project\/(\d+)$/);
    if (project) return { name: 'detail', id: Number(project[1]) };
    if (hash === 'proof' || hash === 'profile') return { name: hash };
    return { name: 'projects' };
  }

  function render() {
    const r = currentRoute();
    document.body.classList.toggle('landing', r.name === 'landing');
    if (r.name === 'landing') {
      // Built once: wallet events re-render the app, and the page's animations shouldn't restart with them.
      if (!$('view').querySelector('.landing-page')) $('view').replaceChildren(viewLanding());
      return;
    }
    stopDemo();
    const views = { projects: viewProjects, proof: viewProofTab, profile: viewProfile, detail: viewDetail, proofPage: viewProof };
    if ((r.name === 'detail' || r.name === 'proofPage') && !state.detail) return;
    $('view').replaceChildren(...views[r.name]().filter(Boolean));
    const active = r.name === 'detail' ? 'projects' : r.name;
    for (const item of document.querySelectorAll('.nav-item')) {
      const on = item.dataset.nav === active;
      item.classList.toggle('active', on);
      if (on) item.setAttribute('aria-current', 'page'); else item.removeAttribute('aria-current');
    }
  }

  function route() {
    const r = currentRoute();
    if (r.name === 'detail' || r.name === 'proofPage') {
      if (Number.isNaN(r.id)) state.detail = { id: null, status: 'missing' };
      else openDetail(r.id);
    } else {
      state.detail = null;
      if (!PROOF_MODE) document.title = 'Freelance Flow — milestones stamped on BOT Chain';
    }
    render();
    window.scrollTo(0, 0);
  }

  function renderChrome() {
    for (const slot of document.querySelectorAll('[data-icon]')) slot.replaceWith(icon(slot.dataset.icon, Number(slot.dataset.size)));
    document.body.classList.toggle('proof', PROOF_MODE);
    $('wordmark').href = url();
    $('side-mark').href = url();
    $('foot-home').href = url();

    // The footer and the top-bar chip always point at the mainnet contract.
    const mainnet = CONFIG.networks.mainnet;
    const explorer = mainnet.contract ? `${mainnet.explorer}/address/${mainnet.contract}` : mainnet.explorer + '/';
    $('foot-explorer').href = explorer;
    $('nav-explorer').href = explorer;
    $('foot-contract').textContent = mainnet.contract ? short(mainnet.contract) : '';
    $('nav-contract').textContent = mainnet.contract ? short(mainnet.contract) : 'Explorer';
    $('foot-net').textContent = `${mainnet.name} mainnet · chain ID ${mainnet.chainId}`;

    const notice = PREVIEW
      ? 'Preview mode · the contract is not deployed yet, so projects are saved in this browser only'
      : netKey === 'testnet' ? 'Testnet · projects stamped here are for testing only'
        : netKey === 'local' ? 'Local chain · for development only' : '';
    $('notice').hidden = !notice;
    $('notice').textContent = notice;
  }

  // ============================================================
  // Boot
  // ============================================================
  function boot() {
    renderChrome();
    if (!PREVIEW) readContract = new ethers.Contract(NET.contract, ABI, new ethers.JsonRpcProvider(NET.rpc, NET.chainId, { staticNetwork: true, batchMaxCount: 1 }));

    $('nav-new').addEventListener('click', openNewProject);
    $('new-form').addEventListener('submit', submitNewProject);
    $('new-form').addEventListener('input', () => formError(''));
    $('np-add').addEventListener('click', () => {
      const row = milestoneInputRow();
      $('np-rows').append(row);
      syncMilestoneRows();
      row.querySelector('input').focus();
    });
    for (const id of ['np-close', 'np-cancel']) $(id).addEventListener('click', () => { if (!creating) dialog.close(); });
    dialog.addEventListener('cancel', (e) => { if (creating) e.preventDefault(); });
    dialog.addEventListener('click', (e) => { if (e.target === dialog && !creating) dialog.close(); });
    $('toast-close').addEventListener('click', hideToast);
    window.addEventListener('hashchange', route);
    window.addEventListener('ethereum#initialized', initWallet, { once: true });

    route();
    initWallet();
  }

  boot();
})();
</script>
